[package]
name = "unbreakable"
version = "0.1.0"
description = "Ultra-secure offline password manager and generator"
authors = ["libreflow"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "unbreakable_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-clipboard-manager = "2.4.0"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
getrandom = "0.4.3"
zeroize = "1.9.0"
thiserror = "2.0.21"
keyring = { version = "4.2", features = ["windows-native-keyring-store"] }
aes-gcm = "0.11"
argon2 = "0.6"
hkdf = "0.13"
sha2 = "0.11"
tempfile = "3.27"
base64 = "0.23"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm"] }

